<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OSLab Copilot</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#18252c;background:#f5f5f1}*{box-sizing:border-box}body{margin:0}header{background:#132832;color:#fff;padding:25px max(24px,calc((100vw - 1100px)/2))}h1{margin:0;font-size:27px;letter-spacing:-.03em}header p{margin:7px 0 0;color:#bdced0}main{max-width:1100px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:400px 1fr;gap:24px}.card{background:#fff;border:1px solid #dce1df;border-radius:10px;padding:22px;box-shadow:0 4px 20px #17313d08}h2{font-size:17px;margin:0 0 18px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #c9d1d0;border-radius:6px;padding:10px;font:inherit;background:#fff;color:#1d292d}textarea{resize:vertical;min-height:75px}#code{min-height:170px;font-family:Consolas,monospace;font-size:12px}button{background:#17675d;color:#fff;border:0;border-radius:6px;padding:12px 16px;font-weight:700;cursor:pointer;margin-top:18px}button:hover{background:#105349}.status{font-size:12px;color:#52646a;margin-top:12px}.result{min-height:400px}.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#58766e;font-weight:800;margin-top:22px}.eyebrow:first-child{margin-top:0}.issue{font-size:23px;line-height:1.25;margin:7px 0}.pill{display:inline-block;background:#e8f3ef;color:#15564e;padding:4px 8px;border-radius:20px;font-size:12px}ul{padding-left:20px}li{margin:7px 0;line-height:1.45}.source{border-top:1px solid #e4e8e7;padding:11px 0}.source small{color:#657679}.source p{margin:5px 0;font-size:13px;line-height:1.45}details{margin-top:20px;border-top:1px solid #dce1df;padding-top:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f5;padding:12px;border-radius:6px;font-size:11px;max-height:350px;overflow:auto}@media(max-width:780px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>OSLab Copilot</h1><p>Structured course evidence meets program behaviour analysis</p></header><main><section class="card"><h2>Analyse an experiment</h2><label for="experiment">Experiment</label><select id="experiment"><option value="FW01">FW01 · fork and wait</option><option value="EX01">EX01 · exec</option><option value="PI01">PI01 · pipe</option></select><label for="mode">Mode</label><select id="mode"><option>Debug</option><option>Learn</option><option>Procedure</option><option>Viva</option></select><label for="question">Question</label><textarea id="question" placeholder="What happened or what would you like to understand?"></textarea><label for="code">Optional C or shell code</label><textarea id="code" spellcheck="false" placeholder="Paste source code for static analysis"></textarea><label for="output">Optional compiler or runtime output</label><textarea id="output" spellcheck="false" placeholder="Paste observed output"></textarea><button id="analyse">Analyse</button><div class="status">Pasted code is never executed. Local demo; no API key required.</div></section><section class="card result" id="result"><h2>Result</h2><p>Select an experiment and analyse it. The technical view includes backend scores and extracted features.</p></section></main>
<script>
const el=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
el('analyse').onclick=async()=>{const request={experiment:el('experiment').value,mode:el('mode').value,question:el('question').value,code:el('code').value,output:el('output').value};el('result').innerHTML='<h2>Analysing…</h2>';try{const response=await fetch('/api/analyse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const data=await response.json();if(!response.ok)throw Error(data.error);let html='<div class="eyebrow">Diagnosis</div><div class="issue">'+esc(data.likely_issue||'Instructional evidence')+'</div><span class="pill">'+esc(data.evidence_strength||data.execution_status)+'</span>';if(data.supporting_signals?.length)html+='<div class="eyebrow">Evidence</div><ul>'+data.supporting_signals.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';if(data.expected_behaviour?.length)html+='<div class="eyebrow">Expected vs observed</div><p><b>Expected:</b> '+esc(data.expected_behaviour.join(' → '))+'</p><p><b>Observed / inferred:</b> '+esc(data.observed_behaviour.join(' → ')||'No behavioural evidence supplied')+'</p>';if(data.matched_failure_cases?.length)html+='<div class="eyebrow">Similar failure cases</div><ul>'+data.matched_failure_cases.map(x=>'<li>'+esc(x.id)+' ('+esc(x.failure_label)+'): '+esc(x.matched_signals.join(', '))+'</li>').join('')+'</ul>';html+='<div class="eyebrow">Retrieved sources</div>'+data.retrieved_sources.map(x=>'<div class="source"><b>'+esc(x.experiment_id+' · '+x.section_type)+'</b> <small>'+esc(x.source)+' · '+esc(x.page_section)+'</small><p>'+esc(x.text)+'</p></div>').join('');html+='<div class="eyebrow">Explanation</div><p>'+esc(data.explanation)+'</p>';if(data.next_check)html+='<p><b>Next check:</b> '+esc(data.next_check)+'</p>';html+='<details><summary>Technical view: records, scores, features</summary><pre>'+esc(JSON.stringify(data,null,2))+'</pre></details>';el('result').innerHTML=html}catch(error){el('result').innerHTML='<h2>Analysis failed</h2><p>'+esc(error.message)+'</p>'}};
</script></body></html>
